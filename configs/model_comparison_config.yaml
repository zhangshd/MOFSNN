# Tasks to evaluate
tasks:
  - TSD
  - SSD
  - WS24_water
  - WS24_water4
  - WS24_acid
  - WS24_base
  - WS24_boiling

# Task types (regression or classification)
task_types:
  TSD: regression
  SSD: classification
  WS24_water: classification
  WS24_water4: classification
  WS24_acid: classification
  WS24_base: classification
  WS24_boiling: classification

# Example model comparison groups (for reference)
comparison_groups:
  # Standard comparison between model families
  standard:
    - Reference
    - Baseline-TSD
    - Baseline-SSD
    - Baseline-WS24_water
    - Baseline-WS24_water4
    - Baseline-WS24_acid
    - Baseline-WS24_base
    - Baseline-WS24_boiling
    - TSD  # Representative for CGCNN Single-Task
    - SSD  # Representative for CGCNN Single-Task
    - WS24_water  # Representative for CGCNN Single-Task
    - WS24_water4  # Representative for CGCNN Single-Task
    - WS24_acid  # Representative for CGCNN Single-Task
    - WS24_base  # Representative for CGCNN Single-Task
    - WS24_boiling  # Representative for CGCNN Single-Task
    - TSD_SSD_WS24_all  # CGCNN Multi-Task
    - TSD_SSD_WS24_all_attn  # MOFSNN
  
  # MOFSNN ablation study
  ablation:
    - MOFSNN_no_lattice
    - MOFSNN_no_attn
    - TSD_SSD_WS24_all_attn  # Full MOFSNN
  
  # MOFSNN subset comparison of w/ or w/o weak correlated tasks
  correlation:
    - WS24_all  # MOFSNN Strong
    - TSD_SSD_WS24_all_attn  # Full MOFSNN

  # MOFSNN subset comparison of w/ or w/o small datasets
  datasize:
    - TSD_SSD_WS24_water_WS24_water4  # MOFSNN Large
    - TSD_SSD_WS24_all_attn  # Full MOFSNN
  
  # MOFSNN augmentation comparison
  augmentation:
    - TSD_SSD_WS24_all_attn_aug_balance
    - TSD_SSD_WS24_all_attn_no_downsampling
    - TSD_SSD_WS24_all_attn  # Full MOFSNN

  # MOFSNN augmentation comparison
  augmentation_uncertainty:
    - TSD_SSD_WS24_all_attn_aug_uncertainty1
    - TSD_SSD_WS24_all_attn_aug_uncertainty2
    - TSD_SSD_WS24_all_attn_aug_uncertainty3
    - TSD_SSD_WS24_all_attn  # Full MOFSNN

  # MOFSNN augmentation comparison
  augmentation_uncertainty_rate:
    - TSD_SSD_WS24_all_attn_aug_uncertainty11
    - TSD_SSD_WS24_all_attn_aug_uncertainty12
    - TSD_SSD_WS24_all_attn_aug_uncertainty13
    - TSD_SSD_WS24_all_attn  # Full MOFSNN
